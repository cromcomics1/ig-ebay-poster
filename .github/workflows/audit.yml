name: Listing audit

on:
  schedule:
    - cron: "0 7 1,15 * *"   # 1st and 15th of each month, so Auto-refresh has a fresh list
  workflow_dispatch:
    inputs:
      limit:
        description: "How many listings to check (0 = all)"
        default: "0"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run audit
        run: python audit.py
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          AUDIT_LIMIT: ${{ inputs.limit || '0' }}

      - name: Save results to the audit-results branch
        run: |
          git config user.name "ig-poster-bot"
          git config user.email "ig-poster-bot@users.noreply.github.com"
          git checkout -q -B audit-results
          git add audit
          git commit -q -m "Listing audit"
          git push -q -f origin audit-results
