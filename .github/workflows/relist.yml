name: Refresh listings
run-name: "Refresh listings: ${{ inputs.step }}"

# HOW TO USE (each batch takes 3 runs):
#   Run 1: STEP = "1 - Make a plan". Fill in the PLAN lines. Nothing on eBay changes.
#   Run 2: STEP = "2 - Carry out the plan", WHICH ITEMS = all, PRACTICE ONLY = on.
#          eBay checks each new listing. Nothing changes.
#   Run 3: same as Run 2 but PRACTICE ONLY = off. This relists for real.
# PLAN lines are only used in step 1. CARRY OUT lines are only used in step 2.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "STEP: 1 = make a plan (safe), 2 = carry out the plan"
        type: choice
        options:
          - "1 - Make a plan"
          - "2 - Carry out the plan"
        default: "1 - Make a plan"
      items:
        description: "PLAN: specific item numbers (leave BLANK to auto-pick)"
        default: ""
      min_price:
        description: "PLAN auto-pick: only items priced at least $"
        default: "100"
      min_age:
        description: "PLAN auto-pick: only items listed at least this many days ago"
        default: "180"
      count:
        description: "PLAN auto-pick: how many items to pick"
        default: "5"
      price_change:
        description: "PLAN: change price by % (10 = 10% more, -10 = 10% less, blank = same)"
        default: "10"
      ad_rate:
        description: "PLAN: promoted ad rate % (blank = no ad)"
        default: "4.2"
      approve:
        description: "CARRY OUT: which items (all, a count like 3, or item numbers)"
        default: "all"
      dry_run:
        description: "CARRY OUT: practice only (ON = nothing really changes)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  relist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Git identity
        run: |
          git config user.name "ig-poster-bot"
          git config user.email "ig-poster-bot@users.noreply.github.com"

      - name: Refresh listings
        run: python relist.py
        env:
          EBAY_USER_TOKEN: ${{ secrets.EBAY_USER_TOKEN }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          PRICE_CHANGE: ${{ inputs.price_change }}
          AD_RATE: ${{ inputs.ad_rate }}
          MODE: ${{ startsWith(inputs.step, '2') && 'apply' || 'propose' }}
          ITEMS: ${{ inputs.items }}
          MIN_PRICE: ${{ inputs.min_price }}
          MIN_AGE: ${{ inputs.min_age }}
          COUNT: ${{ inputs.count }}
          APPROVE: ${{ inputs.approve }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
